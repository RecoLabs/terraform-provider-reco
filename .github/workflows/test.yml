name: Tests

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    # terraform-plugin-testing drives a real terraform binary, even for the offline unit tests.
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_wrapper: false

    - run: go build -v .

    - name: Lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
      with:
        version: v2.15.0

    # Offline: the resources and data sources run against the in-memory fake API in internal/fakereco.
    - name: Unit tests and coverage gate
      run: ./scripts/check-coverage.sh

    - name: Test file coverage
      run: ./scripts/check-test-coverage.sh

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_wrapper: false

    - run: make generate

    - name: Check for uncommitted generated changes
      run: git diff --compact-summary --exit-code

  # End-to-end acceptance tests against a real Reco tenant, on every PR and on pushes to main.
  #
  # - Fork PRs don't receive secrets, so they skip this job; a maintainer has to verify those.
  # - Runs are serialized across the whole repo (one tenant, one run at a time) and never cancelled
  #   mid-flight, because cancelling would leak objects into the tenant. GitHub keeps only the newest
  #   waiting run per group, so a superseded run shows as cancelled before it started.
  # - Every object the tests create is named tf-acc-*; the sweepers delete only such objects.
  # - Do not set TF_LOG: debug logging prints state, including the reco_api_key secret.
  acceptance:
    # Don't touch the tenant for a change that doesn't even build, lint or pass its unit tests.
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Anyone who can push a branch here can run arbitrary code with the tenant key. Create the
    # "acceptance" environment (Settings -> Environments), add required reviewers, and move the two
    # secrets into it to put an approval step in front of that. GitHub creates the environment on first
    # use; without protection rules it behaves like plain repository secrets.
    environment: acceptance
    concurrency:
      group: reco-acceptance-tenant
      cancel-in-progress: false
    env:
      RECO_API_KEY: ${{ secrets.RECO_API_KEY }}
      RECO_BASE_URL: ${{ secrets.RECO_BASE_URL }}
    steps:
    - name: Check credentials
      run: |
        if [[ -z "$RECO_API_KEY" || -z "$RECO_BASE_URL" ]]; then
          echo "::error::Add the RECO_API_KEY and RECO_BASE_URL repository secrets to run the acceptance tests."
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_wrapper: false

    - name: Remove objects leaked by earlier runs
      run: make sweep

    - name: Acceptance tests
      run: make testacc ACC_TIMEOUT=35m

    - name: Remove objects leaked by this run
      if: always() && env.RECO_API_KEY != '' && env.RECO_BASE_URL != ''
      run: make sweep
